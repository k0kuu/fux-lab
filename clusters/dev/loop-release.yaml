apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loop-app
  namespace: flux-system
spec:
  interval: 5m
  releaseName: loop-app
  targetNamespace: loop
  chart:
    spec:
      chart: ./charts/loop-app
      sourceRef:
        kind: GitRepository
        name: flux-system
  install:
    createNamespace: true
  values:
    replicaCount: 2
    message: "hello from flux"
